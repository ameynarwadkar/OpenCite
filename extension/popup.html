<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenCite</title>
    <style>
      * { box-sizing: border-box; }
      body {
        width: 290px;
        margin: 0;
        padding: 14px;
        font-family: "Google Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #ffffff;
        color: #09090b;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 14px;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 7px;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #38bdf8;
      }
      p {
        margin: 0 0 12px;
        font-size: 12px;
        color: #52525b;
        line-height: 1.4;
      }
      label {
        display: block;
        font-size: 11px;
        font-weight: 600;
        color: #3f3f46;
        margin-bottom: 5px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      input {
        width: 100%;
        padding: 8px 10px;
        border: 1px solid #d4d4d8;
        border-radius: 8px;
        font-size: 12.5px;
        font-family: inherit;
        color: #09090b;
        outline: none;
      }
      input:focus { border-color: #09090b; }
      .row {
        display: flex;
        gap: 6px;
        margin-top: 10px;
      }
      button {
        flex: 1;
        padding: 8px 10px;
        border-radius: 8px;
        font-family: inherit;
        font-size: 12.5px;
        font-weight: 500;
        cursor: pointer;
        border: 1px solid #09090b;
      }
      .btn-primary {
        background: #09090b;
        color: #fafafa;
      }
      .btn-primary:hover { background: #27272a; }
      .btn-outline {
        background: #ffffff;
        color: #09090b;
        border-color: #d4d4d8;
      }
      .btn-outline:hover { border-color: #09090b; }
      .status {
        margin-top: 8px;
        font-size: 11.5px;
        color: #059669;
        min-height: 16px;
      }
    </style>
  </head>
  <body>
    <h1><span class="dot"></span>OpenCite</h1>
    <p>Choose your local app or hosted Hugging Face Space URL.</p>
    <label for="base-url">OpenCite URL</label>
    <input id="base-url" type="url" placeholder="http://127.0.0.1:8000" />
    <div class="row">
      <button id="save-btn" class="btn-primary" type="button">Save</button>
      <button id="local-btn" class="btn-outline" type="button">Use Local</button>
    </div>
    <div class="row">
      <button id="open-current-btn" class="btn-outline" type="button">Open This Page ↗</button>
    </div>
    <div id="status" class="status"></div>
    <script src="popup.js"></script>
  </body>
</html>
